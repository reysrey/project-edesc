services:
  db:
    image: postgres:16-alpine
    container_name: kaizenboard-db
    environment:
      POSTGRES_DB: KaizenBoardDb
      POSTGRES_USER: kaizen
      POSTGRES_PASSWORD: kaizen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: